<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OTel Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
  h1 { margin-bottom: 0.25rem; }
  .subtitle { color: #777; margin-top: 0; }
  section { border: 1px solid #ccc3; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
  h2 { margin-top: 0; font-size: 1.05rem; }
  label { display: block; font-size: 0.85rem; margin-top: 0.5rem; }
  input { width: 100%; padding: 0.4rem; margin-top: 0.15rem; box-sizing: border-box; }
  button { margin-top: 0.75rem; margin-right: 0.5rem; padding: 0.5rem 0.9rem; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; }
  th, td { text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid #ccc3; font-size: 0.9rem; }
  #log { background: #1114; border-radius: 6px; padding: 0.75rem; font-family: ui-monospace, monospace; font-size: 0.8rem; max-height: 220px; overflow-y: auto; white-space: pre-wrap; }
  .links a { margin-right: 1rem; }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 200px; }
  .badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 10px; font-size: 0.75rem; margin-left: 0.5rem; }
  .ok { background: #2a7a2a33; }
  .err { background: #a3232333; }
</style>
</head>
<body>
  <h1>OTel Demo</h1>
  <p class="subtitle">Click around to generate traces, metrics, and logs, then check the observability UIs below.</p>

  <section class="links">
    <h2>Observability UIs</h2>
    <a href="/docs" target="_blank">Swagger</a>
    <a href="http://localhost:16686" target="_blank">Jaeger</a>
    <a href="http://localhost:9090" target="_blank">Prometheus</a>
    <a href="http://localhost:3000/d/otel-demo/otel-demo" target="_blank">Grafana Dashboard</a>
    <a href="http://localhost:3000/explore" target="_blank">Grafana Explore</a>
  </section>

  <section>
    <h2>Create item <span id="create-badge"></span></h2>
    <div class="row">
      <div>
        <label>Name<input id="item-name" value="widget" /></label>
      </div>
      <div>
        <label>Price (negative → 400 error)<input id="item-price" type="number" step="0.01" value="9.99" /></label>
      </div>
    </div>
    <button onclick="createItem()">POST /items</button>
  </section>

  <section>
    <h2>Items</h2>
    <button onclick="listItems()">GET /items</button>
    <label style="display:inline-block; width:auto; margin-left:1rem;">
      id
      <input id="item-id" type="number" value="1" style="width:80px; display:inline-block;" />
    </label>
    <button onclick="getItem()">GET /items/{id}</button>
    <button onclick="deleteItem()">DELETE /items/{id}</button>
    <table id="items-table">
      <thead><tr><th>id</th><th>name</th><th>price</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h2>Chaos <span id="chaos-badge"></span></h2>
    <label style="display:inline-block; width:auto;">
      # requests
      <input id="chaos-count" type="number" value="1" style="width:80px; display:inline-block;" />
    </label>
    <button onclick="fireChaos()">GET /chaos</button>
  </section>

  <section>
    <h2>Activity log</h2>
    <div id="log"></div>
  </section>

<script>
const log = (msg) => {
  const el = document.getElementById('log');
  const time = new Date().toISOString().split('T')[1].slice(0, 8);
  el.textContent = `[${time}] ${msg}\n` + el.textContent;
};

const badge = (id, ok) => {
  const el = document.getElementById(id);
  el.textContent = ok ? 'ok' : 'error';
  el.className = 'badge ' + (ok ? 'ok' : 'err');
  setTimeout(() => { el.textContent = ''; el.className = 'badge'; }, 2000);
};

async function createItem() {
  const name = document.getElementById('item-name').value;
  const price = parseFloat(document.getElementById('item-price').value);
  const res = await fetch('/items', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, price }),
  });
  const body = await res.json();
  log(`POST /items -> ${res.status} ${JSON.stringify(body)}`);
  badge('create-badge', res.ok);
  if (res.ok) listItems();
}

async function listItems() {
  const res = await fetch('/items');
  const items = await res.json();
  log(`GET /items -> ${res.status} (${items.length} items)`);
  const tbody = document.querySelector('#items-table tbody');
  tbody.innerHTML = items.map(i => `<tr><td>${i.id}</td><td>${i.name}</td><td>${i.price}</td></tr>`).join('');
}

async function getItem() {
  const id = document.getElementById('item-id').value;
  const res = await fetch(`/items/${id}`);
  const body = await res.json();
  log(`GET /items/${id} -> ${res.status} ${JSON.stringify(body)}`);
}

async function deleteItem() {
  const id = document.getElementById('item-id').value;
  const res = await fetch(`/items/${id}`, { method: 'DELETE' });
  log(`DELETE /items/${id} -> ${res.status}`);
  listItems();
}

async function fireChaos() {
  const count = parseInt(document.getElementById('chaos-count').value, 10) || 1;
  let ok = 0, err = 0;
  for (let i = 0; i < count; i++) {
    try {
      const res = await fetch('/chaos');
      if (res.ok) ok++; else err++;
      log(`GET /chaos -> ${res.status}`);
    } catch (e) {
      err++;
      log(`GET /chaos -> network error`);
    }
  }
  badge('chaos-badge', err === 0);
  log(`chaos batch done: ${ok} ok, ${err} error (of ${count})`);
}

listItems();
</script>
</body>
</html>
